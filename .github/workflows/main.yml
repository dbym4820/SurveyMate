name: CV Deploy CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
          - name: Deploy
            uses: appleboy/ssh-action@master
            with:
              host: ${{ secrets.DEPLOY_HOST }}
              username: ${{ secrets.DEPLOY_USER }}
              port: ${{ secrets.DEPLOY_PORT }}
              key: ${{ secrets.DEPLOY_KEY }}
              script: |
                # エラーを無視して「成功」扱いにしないよう即座に失敗させる
                set -e

                # nvm を読み込んで Node を使う
                export NVM_DIR="$HOME/.nvm"
                if [ -s "$NVM_DIR/nvm.sh" ]; then
                  . "$NVM_DIR/nvm.sh"
                  nvm use 26 || nvm install 26
                fi

                cd ${{ secrets.DEPLOY_DIR }}

                # 前回デプロイ末尾で storage / bootstrap/cache の所有権を
                # Webサーバーユーザーに変更しているため，git reset や setup.sh が
                # Permission denied にならないよう一旦デプロイユーザーに戻す
                sudo chown -R "$(id -un)" storage bootstrap/cache

                # ローカルの変更を破棄してリモートを優先
                git fetch origin
                git reset --hard origin/main
                git clean -fd

                # セットアップ実行
                sh setup.sh

                # Webサーバー用パーミッション設定
                # Bitnamiでは daemon, 一般的には www-data
                WEB_USER="daemon"
                if ! id "$WEB_USER" >/dev/null 2>&1; then
                  WEB_USER="www-data"
                fi
                sudo chown -R $WEB_USER:$WEB_USER storage bootstrap/cache
                sudo chmod -R 777 storage bootstrap/cache
